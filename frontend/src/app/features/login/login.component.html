<div class="login-container">
  <div class="login-form-wrapper">
    <h1 class="login-heading">Hi</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>
      <!-- Email Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <!-- Envelope Icon -->
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <polyline points="2 7 12 13 22 7"></polyline>
          </svg>
          <input
            type="email"
            formControlName="email"
            placeholder="Email*"
            class="clean-input"
            autocomplete="email"
          />
        </div>
        <div class="validation-message" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="input-wrapper">
          <!-- Key Icon -->
          <svg class="input-icon key-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7" cy="12" r="4.2"></circle>
            <circle cx="7" cy="12" r="1.3" fill="currentColor"></circle>
            <path d="M11.2 12H21"></path>
            <path d="M17.5 12V15"></path>
            <path d="M20.5 12V15"></path>
          </svg>
          <input
            [type]="passwordVisible ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password*"
            class="clean-input"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="icon-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
          >
            <!-- Eye Slashed (Hidden state as in reference) -->
            <svg *ngIf="!passwordVisible" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
            <!-- Eye Open (Visible state) -->
            <svg *ngIf="passwordVisible" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="validation-message" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
        </div>
      </div>

      <!-- Error Message -->
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- LOGIN Button -->
      <button type="submit" class="login-btn" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'LOGGING IN...' : 'LOGIN' }}
      </button>
    </form>
  </div>
</div>
