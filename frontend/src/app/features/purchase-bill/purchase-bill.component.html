<div class="purchase-bill-page">
  <!-- Top App Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="info-icon" title="Information">
        <svg viewBox="0 0 32 32" width="27" height="27" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#ffffff" stroke-width="1.8" />
          <text x="16" y="22.5" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="19">i</text>
        </svg>
      </div>
      <div class="header-titles">
        <h1>Purchase Bill</h1>
        <span class="subtitle">Enter Information for the Purchase Bill</span>
      </div>
    </div>

    <div class="header-actions">
      <!-- 1. Refresh clockwise arrow (no outer circle) -->
      <button class="action-btn" title="Reset / Refresh" (click)="resetAll()" type="button">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"></path>
          <polyline points="21 3 21 8 16 8"></polyline>
        </svg>
      </button>

      <!-- 2. Plus in Circle -->
      <button class="action-btn" title="New" (click)="newBill()" type="button">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <line x1="12" y1="7.5" x2="12" y2="16.5"></line>
          <line x1="7.5" y1="12" x2="16.5" y2="12"></line>
        </svg>
      </button>

      <!-- 3. Checkmark in Circle (Save / Submit) -->
      <button class="action-btn check-btn" title="Save Purchase Bill (Submit)" (click)="submitBill()" [disabled]="isSubmitting" type="button">
        <svg *ngIf="!isSubmitting" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <polyline points="8 12.2 10.8 15 16 9.5"></polyline>
        </svg>
        <span *ngIf="isSubmitting" class="spinner"></span>
      </button>

      <!-- 4. Close / X in Circle -->
      <button class="action-btn" title="Close" (click)="close()" type="button">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <line x1="8.5" y1="8.5" x2="15.5" y2="15.5"></line>
          <line x1="15.5" y1="8.5" x2="8.5" y2="15.5"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Secondary Header Navigation (Sub Nav) -->
  <nav class="sub-nav">
    <div class="sub-nav-content">
      <a class="nav-item">Header</a>
      <a class="nav-item active">Details</a>
      <a class="nav-item">Notes</a>
      <a class="nav-item">Documents</a>
    </div>
  </nav>

  <!-- Notification Banner -->
  <div *ngIf="submitMessage" class="submit-banner" [class.error]="submitError">
    <span>{{ submitMessage }}</span>
    <button class="close-banner" (click)="submitMessage = ''">✕</button>
  </div>

  <!-- Page Body -->
  <main class="page-body">
    <div class="main-layout">
      
      <!-- Left Card: Form & Table -->
      <section class="left-card">
        <!-- Inner Tabs -->
        <div class="card-tabs">
          <button 
            type="button"
            class="card-tab" 
            [class.active]="activeTab === 'Items'" 
            (click)="setTab('Items')"
          >
            Items
          </button>
          <button 
            type="button"
            class="card-tab" 
            [class.active]="activeTab === 'Accounts'" 
            (click)="setTab('Accounts')"
          >
            Accounts
          </button>
          <button 
            type="button"
            class="card-tab" 
            [class.active]="activeTab === 'Taxes'" 
            (click)="setTab('Taxes')"
          >
            Taxes
          </button>
        </div>

        <div class="card-body">
          <ng-container *ngIf="activeTab === 'Items'">
            <app-item-entry (itemAdded)="onItemAdded($event)"></app-item-entry>
            <app-items-table [items]="items"></app-items-table>
          </ng-container>
          
          <div *ngIf="activeTab === 'Accounts'" class="placeholder-tab">
            Accounts functionality is not implemented in this stage.
          </div>
          
          <div *ngIf="activeTab === 'Taxes'" class="placeholder-tab">
            Taxes functionality is not implemented in this stage.
          </div>
        </div>
      </section>

      <!-- Right Card: Summary Panel -->
      <aside class="right-card">
        <app-summary [items]="items"></app-summary>
      </aside>

    </div>
  </main>
</div>
